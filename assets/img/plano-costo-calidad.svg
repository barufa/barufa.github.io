<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Cost per trial vs pass@3 across the five arms</title>
<desc id="d">Claude baseline: 1.00 dollars and 91.7 percent. Claude caveman: 0.76 dollars and 86.7 percent. Claude medium: 0.62 dollars and 86.7 percent. Codex baseline: 0.26 dollars and 93.3 percent. Codex caveman: 0.25 dollars and 90.0 percent. Claude caveman and claude medium reach the same pass@3, but caveman costs 23 percent more.</desc>
<style>
  :root { color-scheme: light dark; }
  .bg   { fill: none; }
  .grid { stroke: #e3e1dc; stroke-width: 1; }
  .axis { stroke: #c9c6c0; stroke-width: 1.25; }
  .tick { fill: #86837c; font-size: 12px; }
  .axt  { fill: #6f6c65; font-size: 12.5px; }
  .lbl  { fill: #4a4842; font-size: 12.5px; }
  .note { fill: #86837c; font-size: 11.5px; font-style: italic; }
  .lgd  { fill: #6f6c65; font-size: 12px; }
  .annl { stroke: #a9a6a0; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .blue   { stroke: #2a78d6; }
  .orange { stroke: #eb6834; }
  .fblue   { fill: #2a78d6; }
  .forange { fill: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .grid { stroke: #35332f; }
    .axis { stroke: #4a4741; }
    .tick, .axt, .note, .lgd { fill: #93908a; }
    .lbl  { fill: #d6d3cd; }
    .annl { stroke: #5c5952; }
    .blue   { stroke: #5c9ce8; }
    .orange { stroke: #f28657; }
    .fblue   { fill: #5c9ce8; }
    .forange { fill: #f28657; }
  }
</style>
